# @package _global_
# Pipeline check: the three normal.yaml stages with a handful of updates each.
stages:
  - name: train
    overrides:
      - +exp=ppo_roa/train
      - +task/patches=[teacher_future_t16,root_global_xyz]
      - total_iters=20
      - algo.train_every=32
    load_checkpoint_from_previous: false
  - name: adapt
    overrides:
      - +exp=ppo_roa/adapt
      - +task/patches=[teacher_future_t16,root_window_xyz]
      - total_iters=10
      - algo.train_every=16
    load_checkpoint_from_previous: true
  - name: finetune
    overrides:
      - +exp=ppo_roa/finetune
      - +task/patches=[teacher_future_t16,root_window_xyz]
      - total_iters=10
      - algo.train_every=32
    load_checkpoint_from_previous: true
