[project]
name = "aa-a2-env"
version = "0.1.0"
requires-python = "==3.12.*"
# active-adaptation venv/mjlab (b6a6b3f) + MimicLite. mimic-lite's own pyproject-mjlab.toml asks
# for an active_adaptation[mjlab] extra that no longer exists, so mjlab is listed directly.
dependencies = [
    "active-adaptation",
    "mimic-lite",
    "mjlab==1.6.0",
    "motrixsim>=0.8.2",
    "pandas",
]

[tool.uv.sources]
active-adaptation = { path = "../..", editable = true }
mimic-lite = { path = "../../projects/mimic-lite", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
package = false
index-strategy = "unsafe-best-match"
override-dependencies = [
    "torch==2.11",
    "torchaudio==2.11",
    "torchvision==0.26.0",
    # mjlab needs mujoco and mujoco-warp from the same release (README troubleshooting)
    "mujoco==3.11.0",
    "mujoco-warp==3.11.0",
]
